<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Label Filer</title>
<style>
  :root {
    /* ダーク：ほぼモノクロのニュートラルグレー階調。アクセントは要所のみ */
    --canvas: #0e0e10;
    --surface: #161618;
    --surface-raised: #1d1d20;
    --surface-sunken: #0a0a0b;
    --hover: #27272b;
    --border: #2a2a2e;
    --border-strong: #3a3a40;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --text-faint: #71717a;
    --accent: #e4e4e7;          /* 主役ボタン＝高コントラストの明色（Vercel流） */
    --accent-hover: #ffffff;
    --accent-press: #d4d4d8;
    --on-accent: #0e0e10;       /* 主役ボタンの上に乗る文字色 */
    --focus: #6e8fd6;           /* フォーカス枠・状態表示の最小アクセント */
    --focus-tint: rgba(110, 143, 214, 0.16);
    --danger: #e5727c;
    --success: #4caf7d;
    --warning: #e0b34d;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-full: 999px;
    --shadow-pop: 0 1px 2px rgba(0,0,0,0.4);
    --card-min: 180px;
  }
  :root[data-theme="light"] {
    /* ライト：白〜淡グレー基調。アクセントは黒に近い濃色 */
    --canvas: #fbfbfc;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --surface-sunken: #f1f1f3;
    --hover: #f1f1f3;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --text-muted: #52525b;
    --text-faint: #8a8a93;
    --accent: #18181b;          /* 主役ボタン＝ほぼ黒 */
    --accent-hover: #000000;
    --accent-press: #3f3f46;
    --on-accent: #ffffff;
    --focus: #3a72b8;
    --focus-tint: rgba(58, 114, 184, 0.12);
    --danger: #c23b46;
    --success: #2f8f5f;
    --warning: #b9842c;
    --shadow-pop: 0 1px 2px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--canvas);
    color: var(--text);
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
  header { flex: 0 0 auto; padding: 0.8rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .toolbarGroup {
    display: flex;
    gap: 2px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
  }
  .toolbarGroup button {
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: transparent;
    border-color: transparent;
    color: var(--text-muted);
  }
  .toolbarGroup button:hover { background: var(--hover); border-color: transparent; color: var(--text); }
  .btnIcon { font-size: 14px; }
  /* 土台＝標準ボタン（中立。グレーの面＋ヘアライン枠） */
  button {
    background: var(--surface-raised);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.45rem 0.85rem;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  button:hover { background: var(--hover); border-color: var(--border-strong); }
  button:active { background: var(--surface-sunken); }
  button:disabled { background: var(--surface-raised); border-color: var(--border); color: var(--text-faint); cursor: default; }
  /* 主役ボタン＝高コントラストの塗り（画面内で数個だけ） */
  button.primary {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.primary:active { background: var(--accent-press); border-color: var(--accent-press); }
  button.primary:disabled { background: var(--surface-raised); border-color: var(--border); color: var(--text-faint); }
  /* 控えめボタン＝枠だけ */
  button.secondary {
    background: transparent;
    border-color: var(--border);
    color: var(--text-muted);
  }
  button.secondary:hover { background: var(--hover); border-color: var(--border-strong); color: var(--text); }
  button.secondary:active { background: var(--surface-sunken); }
  button.secondary:disabled { background: transparent; border-color: var(--border); color: var(--text-faint); }
  /* 危険ボタン */
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  button.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  #centerToast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface-raised);
    border: 1px solid var(--focus);
    border-radius: var(--radius-md);
    padding: 1rem 1.6rem;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 9999;
  }
  #centerToast.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
  #centerSpinner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 9998;
    pointer-events: none;
  }
  #centerSpinner.show { display: block; }
  #centerSpinner .spinnerRing {
    width: 64px;
    height: 64px;
    border: 6px solid var(--border);
    border-top-color: var(--focus);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px var(--focus-tint);
  }
  #langSelect, #themeSelect {
    background: var(--surface-sunken);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.6rem;
    font-size: 13px;
    cursor: pointer;
  }
  #langSelect:hover, #themeSelect:hover { border-color: var(--border-strong); }
  #statusBar {
    flex: 0 0 auto;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0.4rem 1rem 0.5rem;
  }
  #folders { font-size: 12px; color: var(--text-faint); }
  #status { font-size: 13px; color: var(--text-muted); min-height: 1.2em; }
  #progressWrap { padding-top: 0.3rem; display: none; }
  #progressBar { width: 100%; max-width: 480px; height: 8px; background: var(--surface-raised); border-radius: var(--radius-full); overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: var(--success); transition: width 0.2s; }
  #progressText { font-size: 12px; color: var(--text-muted); margin-top: 0.3rem; }
  #dropOverlay {
    display: none;
    position: fixed;
    inset: 12px;
    border: 2px dashed var(--focus);
    border-radius: var(--radius-md);
    background: rgba(0, 0, 0, 0.7);
    color: var(--text);
    font-size: 20px;
    align-items: center;
    justify-content: center;
    z-index: 400;
    pointer-events: none;
  }
  #main { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; }
  #tagPanel {
    width: 220px;
    flex: 0 0 220px;
    height: 100%;
    overflow-y: auto;
    background: var(--surface);
    padding: 0.6rem 0.8rem;
    border-right: 1px solid var(--border);
  }
  #tagResizeHandle {
    flex: 0 0 6px;
    width: 6px;
    align-self: stretch;
    cursor: col-resize;
    background: var(--surface);
  }
  #tagResizeHandle:hover { background: var(--focus); }
  #tagPanel h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 0.2rem 0 0.5rem; }
  #tagPanel.disabledPanel { opacity: 0.45; pointer-events: none; }
  #tagPanelDisabledNote { font-size: 12px; color: var(--warning); margin-bottom: 0.5rem; }
  .tagsHint { font-size: 11px; color: var(--text-faint); margin: 0.1rem 0 0.5rem; }
  #tagSearch {
    width: 100%;
    box-sizing: border-box;
    font-size: 12px;
    background: var(--surface-sunken);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.35rem 0.5rem;
    margin-bottom: 0.5rem;
  }
  .modeToggle { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .modeToggle label {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 0.3rem;
    cursor: pointer;
    padding: 0.35rem 0.7rem;
    border-radius: var(--radius-full);
    border: 1px solid var(--border);
    background: var(--surface-sunken);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .modeToggle label.active { background: var(--focus-tint); border-color: var(--focus); color: var(--text); }
  .modeToggle input[type="radio"] { display: none; }
  .tagRow {
    font-size: 12px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.3rem 0.5rem;
    margin-bottom: 3px;
    border-radius: var(--radius-full);
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    transition: background 0.15s, border-color 0.15s;
  }
  .tagRow.active { background: var(--focus-tint); border-color: var(--focus); }
  .tagRow .tagLabel { display: flex; align-items: center; gap: 0.4rem; flex: 1; min-width: 0; cursor: pointer; }
  .tagRow .tagName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tagRow input[type="checkbox"] { display: none; }
  .tagRow .tagTranslateBtn { flex: 0 0 auto; background: none; border: none; color: var(--text-muted); font-size: 11px; padding: 0.1rem 0.3rem; border-radius: var(--radius-sm); }
  .tagRow .tagTranslateBtn:hover { background: var(--surface-raised); color: var(--text); }
  .tagRow .tagTranslateInput { flex: 1; min-width: 0; font-size: 12px; background: var(--surface-sunken); color: var(--text); border: 1px solid var(--focus); border-radius: var(--radius-sm); padding: 0.15rem 0.3rem; }
  .tagRow span.cnt { color: var(--text-faint); margin-left: auto; }
  #tagClear { font-size: 12px; }
  #content { flex: 1; min-width: 0; height: 100%; overflow-y: auto; }
  #content.similarMode { background: var(--surface-sunken); }
  #similarBar {
    display: none;
    align-items: center;
    gap: 0.8rem;
    padding: 0.5rem 1rem;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #similarBase { display: flex; align-items: center; gap: 0.6rem; }
  #similarFilterBar {
    display: none;
    align-items: center;
    gap: 0.6rem;
    padding: 0.4rem 1rem;
    font-size: 12px;
    color: var(--text);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #gridToolbar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 1rem;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #cardSizeSlider { width: 120px; accent-color: var(--focus); }
  #simThresholdSlider { width: 160px; accent-color: var(--focus); }
  #simThresholdInput {
    width: 60px;
    font-size: 12px;
    background: var(--surface-sunken);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.25rem 0.4rem;
  }
  #simThresholdLabel { color: var(--focus); min-width: 6em; }
  #similarBaseImg { width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius-sm); border: 2px solid var(--focus); background: var(--surface-sunken); }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
    gap: 12px;
    padding: 1rem;
  }
  #grid.galleryMode {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
  }
  #grid.galleryMode .card {
    border-radius: 0;
  }
  #grid.galleryMode .card img {
    width: 100%;
    height: auto;
    aspect-ratio: auto;
    object-fit: contain;
    max-height: 85vh;
    cursor: zoom-in;
  }
  #grid.galleryMode .cardSelectBox {
    display: none;
  }
  .card {
    position: relative;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--border-strong); }
  .card img { width: 100%; aspect-ratio: 1 / 1; height: auto; object-fit: cover; display: block; background: var(--surface-sunken); cursor: pointer; }
  .card .score { font-size: 11px; font-weight: 600; padding: 0.4rem 0.5rem; }
  .cardSelectBox {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 18px;
    height: 18px;
    margin: 0;
    cursor: pointer;
    z-index: 2;
  }
  #selectionBar {
    display: none;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }
  #selectionBar.show { display: flex; }

  .modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modalBox {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    width: min(560px, 92vw);
    max-height: 85vh;
    overflow-y: auto;
    padding: 1rem 1.2rem;
  }
  .modalHeader { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.6rem; }
  .modalHeader img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--radius-sm); background: var(--surface-sunken); cursor: pointer; }
  #imgPreviewOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    z-index: 300;
    cursor: zoom-out;
  }
  #imgPreviewOverlay img { max-width: 92vw; max-height: 92vh; object-fit: contain; border-radius: var(--radius-sm); }
  .modalHeader .filename { font-size: 13px; color: var(--text); word-break: break-all; flex: 1; }
  .modalHeader .renameInput { font-size: 13px; flex: 1; min-width: 0; background: var(--surface-sunken); color: var(--text); border: 1px solid var(--focus); border-radius: var(--radius-sm); padding: 0.2rem 0.4rem; }
  .renameBtn { flex: 0 0 auto; background: none; border: none; color: var(--text-muted); font-size: 14px; padding: 0.2rem 0.3rem; border-radius: var(--radius-sm); }
  .renameBtn:hover { background: var(--hover); color: var(--text); }
  .modalFindSimilar { flex: 0 0 auto; font-size: 12px; padding: 0.35rem 0.6rem; }
  .modalClose { flex: 0 0 auto; }
  .modalSection h4 { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 0.8rem 0 0.4rem; }
  .metaBox {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.5rem;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 160px;
    overflow-y: auto;
  }
  .tagChips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .tagChip {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    padding: 0.2rem 0.3rem 0.2rem 0.6rem;
    font-size: 12px;
    color: var(--text);
  }
  .tagChipName { cursor: pointer; }
  .tagChipName:hover { text-decoration: underline; }
  .tagChip button {
    background: none;
    border: none;
    color: var(--danger);
    padding: 0 0.3rem;
    font-size: 12px;
    border-radius: var(--radius-full);
  }
  .tagChip button:hover { background: var(--surface-raised); }
  .tagAddWrap { position: relative; margin-top: 0.5rem; }
  .tagAddInput {
    width: 100%;
    box-sizing: border-box;
    font-size: 12px;
    background: var(--surface-sunken);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.35rem 0.5rem;
  }
  .suggestBox {
    position: fixed;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    max-height: 220px;
    overflow-y: auto;
    z-index: 200;
  }
  .suggestItem { padding: 0.35rem 0.5rem; font-size: 12px; color: var(--text); cursor: pointer; }
  .suggestItem:hover, .suggestItem.active { background: var(--focus-tint); }
  .tagModalStatus { font-size: 12px; color: var(--danger); min-height: 1.2em; margin-top: 0.3rem; }

  .libraryMenu { position: relative; display: flex; }
  .libraryDropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 4px;
    min-width: 280px;
    max-width: 420px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
    z-index: 300;
  }
  .libraryDropdown.open { display: block; }
  .libraryDropdown .libItem {
    font-size: 12px;
    padding: 0.4rem 0.6rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .libraryDropdown .libItem:hover { background: var(--focus-tint); }
  .libraryDropdown .libHistoryRow { display: flex; align-items: center; gap: 2px; }
  .libraryDropdown .libHistoryPath { flex: 1; min-width: 0; }
  .libraryDropdown .libRemove {
    flex: 0 0 auto;
    padding: 0.25rem 0.45rem;
    border: 0;
    background: transparent;
    color: var(--text-muted);
  }
  .libraryDropdown .libRemove:hover { color: var(--danger); background: var(--focus-tint); }
  .libraryDropdown .libDivider { border-top: 1px solid var(--border); margin: 4px 0; }

  #libraryPickerOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--canvas);
    color: var(--text);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    z-index: 500;
    text-align: center;
    padding: 2rem;
  }
  #libraryPickerOverlay.show { display: flex; }
  #libraryPickerOverlay h2 { font-size: 16px; margin: 0; }
  #libraryPickerOverlay p { color: var(--text-muted); font-size: 13px; max-width: 480px; margin: 0; }

  /* セグメント型タブ：沈んだトラックの中で、選択中だけ浮き出る */
  .tagPanelTabs {
    display: flex;
    gap: 2px;
    margin-bottom: 0.7rem;
    padding: 3px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .tagPanelTabs button {
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    padding: 0.35rem 0.5rem;
    border-radius: 4px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
  }
  .tagPanelTabs button:hover { background: transparent; border-color: transparent; color: var(--text); }
  .tagPanelTabs button.active {
    background: var(--surface-raised);
    border-color: var(--border);
    color: var(--text);
    box-shadow: var(--shadow-pop);
  }
  .presetRow .presetName { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .presetRow .presetDelete { flex: 0 0 auto; background: none; border: none; color: var(--text-faint); cursor: pointer; padding: 0 0.3rem; font-size: 13px; }
  .presetRow .presetDelete:hover { color: var(--danger); background: none; }
  #presetSaveBtn { width: 100%; margin-bottom: 0.6rem; }
  #presetEmpty { font-size: 12px; color: var(--text-faint); }
</style>
</head>
<body>
  <header>
    <div class="toolbarGroup">
      <div class="libraryMenu">
        <button id="btnLibrary"><span class="btnIcon">📁</span><span data-i18n="btnLibrary">ライブラリ</span></button>
        <div class="libraryDropdown" id="libraryDropdown"></div>
      </div>
      <button id="btnTag" class="primary"><span class="btnIcon">🏷️</span><span data-i18n="btnTag">タグ付け開始</span></button>
    </div>
    <select id="themeSelect" style="margin-left:auto;">
      <option value="dark" data-i18n="themeDark">ダーク</option>
      <option value="light" data-i18n="themeLight">ライト</option>
    </select>
    <select id="langSelect">
      <option value="ja">日本語</option>
      <option value="en">English</option>

let currentLang = localStorage.getItem('lang') || 'ja';

function tr(key, params) {
  const dict = I18N[currentLang] || I18N.ja;
  const entry = dict[key];
  if (entry === undefined) return key;
  return typeof entry === 'function' ? entry(params || {}) : entry;
}

function errMsg(result, fallbackKey) {
  if (result.code) return tr(result.code);
  return result.error || (fallbackKey ? tr(fallbackKey) : '');
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = tr(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = tr(el.dataset.i18nTitle); });
  document.documentElement.lang = currentLang;
  updateTaggingButton(document.getElementById('btnTag').dataset.mode || 'idle');
}

function updateTaggingButton(mode) {
  const button = document.getElementById('btnTag');
  const label = button.querySelector('[data-i18n="btnTag"]');
  button.dataset.mode = mode;
  button.disabled = mode === 'stopping';
  document.getElementById('btnLibrary').disabled = mode !== 'idle';
  if (mode !== 'idle') document.getElementById('libraryDropdown').classList.remove('open');
  button.classList.toggle('primary', mode === 'idle');
  button.classList.toggle('danger', mode !== 'idle');
  label.textContent = tr(mode === 'idle' ? 'btnTag' : mode === 'running' ? 'btnStopTagging' : 'btnStoppingTagging');
}

document.getElementById('langSelect').value = currentLang;
applyI18n();
document.getElementById('langSelect').addEventListener('change', async (e) => {
  currentLang = e.target.value;
  localStorage.setItem('lang', currentLang);
  applyI18n();
  await refreshLibraryState();
  await refreshGrid();
  await refreshTags();
});

let currentTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', currentTheme);
document.getElementById('themeSelect').value = currentTheme;
document.getElementById('themeSelect').addEventListener('change', (e) => {
  currentTheme = e.target.value;
  localStorage.setItem('theme', currentTheme);
  document.documentElement.setAttribute('data-theme', currentTheme);
});

function renderLibraryDropdown(recentRoots, activeRoot) {
  const dropdown = document.getElementById('libraryDropdown');
  dropdown.innerHTML = '';
  if (recentRoots.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'libItem';
    empty.textContent = tr('libraryNoRecent');
    dropdown.appendChild(empty);
  } else {
    for (const root of recentRoots) {
      const row = document.createElement('div');
      row.className = 'libHistoryRow';
      const item = document.createElement('div');
      item.className = 'libItem libHistoryPath';
      if (root === activeRoot) item.style.color = 'var(--focus)';
      item.textContent = root;
      item.title = root;
      item.addEventListener('click', () => {
        dropdown.classList.remove('open');
        switchLibrary(root);
      });
      const removeButton = document.createElement('button');
      removeButton.className = 'libRemove';
      removeButton.type = 'button';
      removeButton.textContent = '×';
      removeButton.title = tr('libraryRemoveHistory');
      removeButton.setAttribute('aria-label', `${tr('libraryRemoveHistory')}: ${root}`);
      removeButton.addEventListener('click', async (event) => {

function playCompletionBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) {
    console.error('beep failed', e);
  }
}

      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent =

    if (!p.running) {
      clearInterval(pollTimer);
      pollTimer = null;
      updateTaggingButton('idle');
      let msg;
      if (p.error) {
        msg = tr('taggingError', { error: p.error });
      } else if (p.cancelled) {
        msg = tr('taggingStopped', { done: p.done, total: p.total });
      } else if (p.total > 0) {

      setStatus(msg);
      hideCenterSpinner();

// ---- ドラッグ＆ドロップでの画像取り込み ----

function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function readEntryFiles(entry) {
  return new Promise((resolve) => {
    if (entry.isFile) {
      entry.file((file) => resolve([file]), () => resolve([]));
      return;
    }
    if (entry.isDirectory) {
      const reader = entry.createReader();
      const all = [];
      const readBatch = () => {
        reader.readEntries(async (entries) => {
          if (!entries.length) {
            const nested = await Promise.all(all);
            resolve(nested.flat());
            return;
          }
          for (const e of entries) all.push(readEntryFiles(e));
          readBatch();
        }, () => resolve([]));
      };
      readBatch();
      return;
    }
    resolve([]);
  });
}

async function collectDroppedFiles(dataTransfer) {
  const items = Array.from(dataTransfer.items || []);
  const entries = items.map((item) => item.webkitGetAsEntry && item.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) {
    return Array.from(dataTransfer.files || []);
  }
  const lists = await Promise.all(entries.map(readEntryFiles));
  return lists.flat();
}

const SUPPORTED_NAME_RE = /\.(jpg|jpeg|png|webp|bmp|gif|txt|md|log|pdf)$/i;
let dragDepth = 0;

document.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragDepth++;
  document.getElementById('dropOverlay').style.display = 'flex';
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
});

document.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) document.getElementById('dropOverlay').style.display = 'none';
});

document.addEventListener('drop', async (e) => {
  e.preventDefault();
  dragDepth = 0;
  document.getElementById('dropOverlay').style.display = 'none';

  const files = (await collectDroppedFiles(e.dataTransfer)).filter((f) => SUPPORTED_NAME_RE.test(f.name));
  if (!files.length) {
    setStatus(tr('droppedNoImages'));
    return;
  }
  if (files.length >= 10) {
    const ok = window.confirm(tr('importConfirm', { count: files.length }));
    if (!ok) return;
  }

  let imported = 0;
  let skipped = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    setStatus(tr('importing', { current: i + 1, total: files.length }));
    try {
      const buf = await file.arrayBuffer();
      const b64 = arrayBufferToBase64(buf);
      const result = await api().import_dropped_file(file.name, b64);
      if (result.ok) imported++; else skipped++;
    } catch (err) {
      console.error(err);
      skipped++;
    }
  }

  setStatus(tr('importComplete', { imported, skipped }));
  await refreshLibraryState();
  await refreshGrid();
  await refreshTags();
  if (imported > 0) await startTaggingFlow();
});

(function restoreTagPanelWidth() {

  const startX = e.clientX;
  const startWidth = tagPanel.getBoundingClientRect().width;

  function onMove(ev) {
    let width = startWidth + (ev.clientX - startX);
    width = Math.max(TAG_PANEL_MIN, Math.min(TAG_PANEL_MAX, width));
    tagPanel.style.width = width + 'px';
    tagPanel.style.flexBasis = width + 'px';
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    localStorage.setItem('tagPanelWidth', Math.round(tagPanel.getBoundingClientRect().width));

  document.addEventListener('mousemove', onMove);

  localStorage.setItem('cardSizeStep', step);
});

// ---- 画像ごとのタグ確認・追加・削除ポップアップ ----
let dictionaryTagsCache = null;
let tagModalImage = null;
let tagModalCurrentTags = [];
let suggestActiveIndex = -1;

async function getDictionaryTags() {
  if (!dictionaryTagsCache) {
    dictionaryTagsCache = await api().list_dictionary_tags();
  }
  return dictionaryTagsCache;
}

function setTagModalStatus(text) {
  document.getElementById('tagModalStatus').textContent = text || '';
}

function renderTagModalChips() {
  const wrap = document.getElementById('tagModalChips');
  wrap.innerHTML = '';
  if (!tagModalCurrentTags.length) {
    wrap.innerHTML = `<span style="color:#888; font-size:0.74rem;">${tr('noTagsYet')}</span>`;
    return;
  }
  for (const t of tagModalCurrentTags) {
    const chip = document.createElement('span');
    chip.className = 'tagChip';
    const label = t.ja ? `${t.name}（${t.ja}）` : t.name;
    chip.innerHTML = `<span class="tagChipName" title="${tr('filterByThisTag')}">${label}</span><button title="${tr('removeTagTitle')}">✕</button>`;
    chip.querySelector('.tagChipName').addEventListener('click', async () => {
      selectedTags.add(t.name);
      applyTagSearch();
      await refreshGrid();
    });
    chip.querySelector('button').addEventListener('click', async () => {
      const result = await api().remove_image_tag(tagModalImage.id, t.name);
      if (!result.ok) {
        setTagModalStatus(errMsg(result, 'deleteFailed'));
        return;
      }
      tagModalCurrentTags = tagModalCurrentTags.filter((x) => x.name !== t.name);
      renderTagModalChips();
      setTagModalStatus('');
      await refreshTags();
    });
    wrap.appendChild(chip);
  }
}

function hideSuggestBox() {
  const box = document.getElementById('tagModalSuggest');
  box.style.display = 'none';
  box.innerHTML = '';
  suggestActiveIndex = -1;
}

function positionSuggestBox(box) {
  const input = document.getElementById('tagModalAddInput');
  const rect = input.getBoundingClientRect();
  const spaceBelow = window.innerHeight - rect.bottom;
  const maxHeight = 220;
  box.style.left = rect.left + 'px';
  box.style.width = rect.width + 'px';
  if (spaceBelow >= Math.min(maxHeight, 120) || spaceBelow >= rect.top) {
    box.style.top = rect.bottom + 'px';
    box.style.bottom = '';
  } else {
    box.style.top = '';
    box.style.bottom = (window.innerHeight - rect.top) + 'px';
  }
}

async function showSuggestions(query) {
  const box = document.getElementById('tagModalSuggest');
  if (!query) {
    hideSuggestBox();
    return;
  }
  const q = query.toLowerCase();
  const dict = await getDictionaryTags();
  const appliedNames = new Set(tagModalCurrentTags.map((t) => t.name));
  const matches = dict
    .filter((t) => !appliedNames.has(t.name))
    .filter((t) => t.name.toLowerCase().includes(q) || (t.ja && t.ja.toLowerCase().includes(q)))
    .slice(0, 20);

  if (!matches.length) {
    box.innerHTML = `<div class="suggestItem" style="color:#888; cursor:default;">${tr('noSuggestions')}</div>`;
    positionSuggestBox(box);
    box.style.display = 'block';
    suggestActiveIndex = -1;
    return;
  }

  box.innerHTML = '';
  matches.forEach((t) => {
    const item = document.createElement('div');
    item.className = 'suggestItem';
    item.textContent = t.ja ? `${t.name}（${t.ja}）` : t.name;
    item.addEventListener('click', () => addTagFromSuggestion(t));
    box.appendChild(item);
  });
  positionSuggestBox(box);
  box.style.display = 'block';
  suggestActiveIndex = -1;
}

async function addTagToImage(name) {
  if (tagModalCurrentTags.some((t) => t.name === name)) return;
  const result = await api().add_image_tag(tagModalImage.id, name);
  const input = document.getElementById('tagModalAddInput');
  if (!result.ok) {
    setTagModalStatus(errMsg(result, 'addFailed'));
    return;
  }
  tagModalCurrentTags.push({ name: result.name, ja: result.ja });
  tagModalCurrentTags.sort((a, b) => a.name.localeCompare(b.name));
  renderTagModalChips();
  setTagModalStatus('');
  input.value = '';
  hideSuggestBox();
  await refreshTags();
}

async function addTagFromSuggestion(t) {
  await addTagToImage(t.name);
}

function renderMetadataSection(metadata) {
  const section = document.getElementById('tagModalMetaSection');
  const box = document.getElementById('tagModalMeta');
  const keys = Object.keys(metadata || {});
  if (!keys.length) {
    section.style.display = 'none';
    box.textContent = '';
    return;
  }
  section.style.display = 'block';
  box.textContent = keys.map((k) => `[${k}]\n${metadata[k]}`).join('\n\n');
}

async function openTagModal(img) {
  tagModalImage = img;
  document.getElementById('tagModalImg').src = img.thumbnail_url ?? '';
  document.getElementById('tagModalFilename').textContent = img.filename;
  document.getElementById('tagModalAddInput').value = '';
  setTagModalStatus('');
  hideSuggestBox();
  document.getElementById('tagModalOverlay').style.display = 'flex';

  // 文書プレビューの表示制御
  const isDoc = img.filename.match(/\.(txt|md|log|pdf)$/i);
  document.getElementById('tagModalDocPreviewSection').style.display = isDoc ? 'block' : 'none';
  if (isDoc) {
    document.getElementById('tagModalDocPreview').textContent = '読み込み中...';
    try {
      const docRes = await api().get_document_text(img.id);
      if (docRes.ok) {
        document.getElementById('tagModalDocPreview').textContent = docRes.text || '(テキストなし)';
      } else {
        document.getElementById('tagModalDocPreview').textContent = errMsg(docRes, 'file_read_failed');
      }
    } catch (e) {
      console.error(e);
      document.getElementById('tagModalDocPreview').textContent = tr('file_read_failed');
    }
  }

  tagModalCurrentTags = await api().get_image_tags(img.id);
  renderTagModalChips();

  const metaResult = await api().get_image_metadata(img.id);
  renderMetadataSection(metaResult.ok ? metaResult.metadata : {});
}

async function closeTagModal() {
  document.getElementById('tagModalOverlay').style.display = 'none';
  tagModalImage = null;
  await refreshTags();
  await refreshGrid();
}

document.getElementById('tagModalClose').addEventListener('click', closeTagModal);
document.getElementById('tagModalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'tagModalOverlay') closeTagModal();
});

document.getElementById('tagModalRenameBtn').addEventListener('click', (e) => {
  e.currentTarget.style.visibility = 'hidden';
  startModalRename();
});

document.getElementById('tagModalFindSimilar').addEventListener('click', async () => {
  const img = tagModalImage;
  document.getElementById('tagModalOverlay').style.display = 'none';
  tagModalImage = null;
  await refreshTags();
  await showSimilar(img);
});

async function showOriginalImagePreview(img) {
  const previewImg = document.getElementById('imgPreviewImg');
  previewImg.src = img.thumbnail_url ?? '';
  document.getElementById('imgPreviewOverlay').style.display = 'flex';
  const result = await api().get_original_image(img.id);
  if (result.ok) previewImg.src = result.data_url;
}

document.getElementById('tagModalImg').addEventListener('click', () => {
  if (!tagModalImage) return;
  showOriginalImagePreview(tagModalImage);
});

document.getElementById('imgPreviewOverlay').addEventListener('click', () => {
  document.getElementById('imgPreviewOverlay').style.display = 'none';
});

document.getElementById('tagModalAddInput').addEventListener('input', (e) => {
  showSuggestions(e.target.value.trim());
});
document.getElementById('tagModalAddInput').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideSuggestBox();
  if (e.key === 'Enter') {
    const name = e.target.value.trim();
    if (name) addTagToImage(name);
  }
});

document.getElementById('btnEmbedTags').addEventListener('click', async () => {
  if (!tagModalImage) return;
  setTagModalStatus('処理中...');
  const res = await api().embed_tags_to_filename(tagModalImage.id);
  if (!res.ok) {
    setTagModalStatus(errMsg(res, 'renameFailed'));
    return;
  }
  // ファイル名の表示などを更新
  tagModalImage.filename = res.filename;
  tagModalImage.full_path = res.full_path;
  document.getElementById('tagModalFilename').textContent = res.filename;
  setTagModalStatus(tr('embedSucceeded'));
  await refreshGrid();
});

document.getElementById('btnExportSidecar').addEventListener('click', async () => {
  if (!tagModalImage) return;
  setTagModalStatus('処理中...');
  const res = await api().export_sidecar_json(tagModalImage.id);
  if (!res.ok) {
    setTagModalStatus(errMsg(res, 'write_failed'));
    return;
  }
  setTagModalStatus(tr('exportSucceeded'));
});

window.addEventListener('pywebviewready', async () => {
  const state = await refreshLibraryState();
  if (state.active_root) await runAutoScan();
  await refreshGrid();
  await refreshTags();
});
</script>
